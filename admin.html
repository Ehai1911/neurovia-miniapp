<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет куратора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F4F8F6; --app:#FFFFFF; --app-2:#EDF1F5; --ink:#16211E; --ink-soft:#4A5A55; --ink-faint:#7E8C88;
    --border:#DCE6E3; --border-2:#CFDAD6; --accent:#158268; --accent-ink:#0E6852; --accent-soft:#E2F2EC;
    --ok:#1E8A5A; --ok-bg:#E4F4EB; --amber:#9A6A12; --amber-bg:#F7EFDC; --topbar:#12302A;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0E1513; --app:#18211E; --app-2:#212A27; --ink:#E7EEEB; --ink-soft:#A7B5B0; --ink-faint:#74807A;
    --border:#28322E; --border-2:#38433E; --accent:#4FB79A; --accent-ink:#8FD4C0; --accent-soft:#15332A;
    --ok:#57B37E; --ok-bg:#15291D; --amber:#D69B54; --amber-bg:#2A2214; --topbar:#0A1512;
  }}
  :root[data-theme="dark"]{
    --bg:#0E1513; --app:#18211E; --app-2:#212A27; --ink:#E7EEEB; --ink-soft:#A7B5B0; --ink-faint:#74807A;
    --border:#28322E; --border-2:#38433E; --accent:#4FB79A; --accent-ink:#8FD4C0; --accent-soft:#15332A;
    --ok:#57B37E; --ok-bg:#15291D; --amber:#D69B54; --amber-bg:#2A2214; --topbar:#0A1512;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;}
  .top{background:var(--topbar);color:#EAF4EF;padding:14px 16px;}
  .top .tt{font-weight:600;font-size:16px;}
  .top .ts{font-size:12px;color:#8FB6A8;}
  main{padding:14px;max-width:720px;margin:0 auto;}
  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .stat .box{background:var(--app);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;}
  .stat .num{font-size:22px;font-weight:700;color:var(--accent-ink);}
  .stat .lab{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:6px 2px 10px;}
  .row{background:var(--app);border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:10px;}
  .row:hover{border-color:var(--accent);}
  .ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;}
  .row .nm{font-weight:500;font-size:14.5px;}
  .row .sub{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .row .pr{margin-left:auto;text-align:right;}
  .row .pr b{font-size:15px;color:var(--accent-ink);}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:4px;}
  .c-ok{background:var(--ok-bg);color:var(--ok);} .c-amber{background:var(--amber-bg);color:var(--amber);}
  .bar{height:6px;border-radius:4px;background:var(--app-2);overflow:hidden;margin-top:4px;width:80px;margin-left:auto;}
  .bar>span{display:block;height:100%;background:var(--accent);}
  .back{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;}
  .card{background:var(--app);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:11px;}
  .card h3{margin:0 0 4px;font-size:15px;}
  .qa{margin-top:9px;} .qa .q{font-size:13px;color:var(--ink);font-weight:500;} .qa .a{font-size:13px;color:var(--ink-soft);background:var(--app-2);border-radius:8px;padding:7px 10px;margin-top:3px;white-space:pre-wrap;}
  .flags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .btn{appearance:none;border:1px solid var(--border-2);background:var(--app-2);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .lin{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border-2);border-radius:9px;background:var(--app);color:var(--ink);}
  .lin:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .logout{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;float:right;}
  .muted{color:var(--ink-faint);font-size:13px;}
  .err{color:#C0483C;font-size:13px;padding:10px;}
</style>
</head>
<body>
  <div class="top"><div class="tt">Кабинет куратора</div><div class="ts" id="sub">загрузка…</div></div>
  <main>
    <div id="login" hidden>
      <div class="card" style="max-width:360px;margin:40px auto;">
        <h3 style="margin:0 0 12px">Вход куратора</h3>
        <div style="margin-bottom:10px"><input id="in-login" class="lin" placeholder="Логин" autocapitalize="off" autocomplete="username"></div>
        <div style="margin-bottom:12px"><input id="in-pass" class="lin" type="password" placeholder="Пароль" autocomplete="current-password"></div>
        <button class="btn primary" style="width:100%" onclick="doLogin()">Войти</button>
        <div id="login-err" class="err" hidden style="padding:8px 0 0"></div>
      </div>
    </div>
    <div id="cohorts" hidden></div>
    <div id="list" hidden></div>
    <div id="detail" hidden></div>
    <div id="err" class="err" hidden></div>
  </main>
<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light'); var tp=tg.themeParams||{}; var rs=document.documentElement.style; function sv(n,v){if(v)rs.setProperty(n,v);} sv('--bg',tp.bg_color);sv('--app',tp.section_bg_color||tp.bg_color);sv('--app-2',tp.secondary_bg_color||tp.bg_color);sv('--ink',tp.text_color);sv('--ink-soft',tp.subtitle_text_color||tp.hint_color);sv('--ink-faint',tp.hint_color);sv('--accent',tp.button_color);sv('--accent-ink',tp.accent_text_color||tp.link_color||tp.button_color); } catch(e){} }

  var U = new URL(location.href);
  var DEV = U.searchParams.get('dev') === '1';
  var TG = U.searchParams.get('tg') || '999001';
  var initData = (tg && tg.initData) || '';
  var TOKEN = '';
  try { TOKEN = localStorage.getItem('adm_token') || ''; } catch(e){}
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function apiUrl(path, params){ var u=new URL(path, location.origin); if(DEV){u.searchParams.set('dev','1');u.searchParams.set('tg',TG);u.searchParams.set('admin','1');} if(params)Object.keys(params).forEach(function(k){u.searchParams.set(k,params[k]);}); return u.toString(); }
  function hdr(){ var h={}; if(TOKEN) h['Authorization']='Bearer '+TOKEN; else if(initData) h['x-init-data']=initData; return h; }
  async function apiGet(path, params){ var r=await fetch(apiUrl(path,params),{headers:hdr()}); var j=await r.json(); j._status=r.status; return j; }
  async function apiPost(path, body){ var r=await fetch(apiUrl(path),{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body||{})}); var j=await r.json(); j._status=r.status; return j; }

  function showErr(m){ var el=document.getElementById('err'); el.textContent=m; el.hidden=false; }
  function only(id){ ['login','cohorts','list','detail'].forEach(function(x){ document.getElementById(x).hidden = (x!==id); }); }

  function showLogin(msg){ only('login'); document.getElementById('sub').textContent='вход'; var e=document.getElementById('login-err'); if(msg){e.textContent=msg;e.hidden=false;}else{e.hidden=true;} }
  window.doLogin = async function(){
    var login=document.getElementById('in-login').value.trim();
    var password=document.getElementById('in-pass').value;
    var e=document.getElementById('login-err'); e.hidden=true;
    if(!login||!password){ e.textContent='Введите логин и пароль.'; e.hidden=false; return; }
    var r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:login,password:password})});
    var j=await r.json();
    if(!j.ok){ e.textContent=j.error||'Ошибка входа.'; e.hidden=false; return; }
    TOKEN=j.token; try{ localStorage.setItem('adm_token',TOKEN);}catch(x){}
    loadHome();
  };
  window.logout = function(){ TOKEN=''; try{ localStorage.removeItem('adm_token'); }catch(x){} showLogin(); };
  var CUR=null; // текущий поток {id,title}

  // Главный экран кабинета — дашборд: Интенсив / Клуб
  function loadHome(){
    only('cohorts');
    document.getElementById('sub').textContent='';
    var el=document.getElementById('cohorts');
    var sect=function(t){ return '<div style="font-size:13px;letter-spacing:.4px;font-weight:600;color:#5f6f63;margin:18px 2px 8px">'+t+'</div>'; };
    var h=(TOKEN?'<button class="logout" onclick="logout()">выйти</button>':'')+'<h2>Кабинет куратора</h2>'+
      sect('🎓 ИНТЕНСИВ «СПРИНТ»')+
      '<div class="row" style="margin:0 0 8px"><button class="btn" style="width:100%" onclick="loadCohortsList()">👥 Потоки</button></div>'+
      '<div class="row" style="margin:0 0 4px"><button class="btn" style="width:100%" onclick="openSupport()">🆘 Обращения <span id="sup-badge"></span></button></div>'+
      '<div class="row" style="margin:0 0 4px"><button class="btn" style="width:100%" onclick="openProgram()">📝 Программа интенсива</button></div>';
    el.innerHTML=h;
    apiGet('/api/admin/support').then(function(sj){ var b=document.getElementById('sup-badge'); if(b && sj && sj.ok && sj.newCount>0){ b.innerHTML='<span class="chip c-amber">'+sj.newCount+' новых</span>'; } });
  }
  // Список потоков (внутри «Интенсива»)
  async function loadCohortsList(){
    only('cohorts');
    document.getElementById('sub').textContent='потоки';
    var el=document.getElementById('cohorts');
    var j=await apiGet('/api/admin/cohorts');
    if(!j.ok){ if(j._status===401||j._status===403){ showLogin(j._status===401?'Сессия истекла — войдите заново.':''); return; } showErr(j.error||'Ошибка'); return; }
    var h='<button class="back" onclick="loadHome()">← в кабинет</button><h2>Потоки</h2>';
    if(!j.cohorts.length) h+='<div class="muted">Потоков пока нет.</div>';
    j.cohorts.forEach(function(c){
      var dates = c.starts_on ? (fmt(c.starts_on)+(c.ends_on?' – '+fmt(c.ends_on):'')) : '';
      h+='<div class="row" onclick="openCohort(\''+c.id+'\',\''+esc(c.title).replace(/\x27/g,"\\x27")+'\')">'+
        '<div class="ava">'+esc((c.title||'?').replace(/[^0-9]/g,'')||'П')+'</div>'+
        '<div><div class="nm">'+esc(c.title)+(c.is_active?' <span class="chip c-ok">активен</span>':'')+'</div>'+
          '<div class="sub">'+esc(dates)+(dates?' · ':'')+c.students+' участн.</div></div>'+
        '<div class="pr muted">›</div>'+
      '</div>';
    });
    el.innerHTML=h;
  }
  window.loadHome=loadHome; window.loadCohortsList=loadCohortsList;
  // Обращения в поддержку
  window.openSupport = async function(){
    only('list');
    var el=document.getElementById('list'); el.innerHTML='<div class="muted">Загрузка…</div>';
    var j=await apiGet('/api/admin/support');
    if(!j.ok){ el.innerHTML='<button class="back" onclick="loadHome()">← в кабинет</button><div class="err">'+esc(j.error)+'</div>'; return; }
    document.getElementById('sub').textContent='поддержка';
    var h='<button class="back" onclick="loadHome()">← в кабинет</button><h2>Обращения в поддержку</h2>';
    if(!j.messages.length){ h+='<div class="muted">Обращений пока нет.</div>'; el.innerHTML=h; return; }
    j.messages.forEach(function(m){
      var when=''; try{ when=new Date(m.created_at).toLocaleString('ru-RU'); }catch(e){}
      h+='<div class="card"><div class="flags">'+
        (m.status==='new'?'<span class="chip c-amber">новое</span>':'<span class="chip c-ok">решено</span>')+
        '</div><div class="nm">'+esc(m.name)+(m.username?' (@'+esc(m.username)+')':'')+'</div>'+
        '<div class="sub">'+esc(m.cohort)+' · '+esc(when)+' · id '+esc(m.tg_id)+'</div>'+
        '<div style="margin:8px 0;white-space:pre-wrap">'+esc(m.text)+'</div>'+
        '<textarea id="rep-'+m.id+'" placeholder="Ответ участнику…" style="width:100%;padding:8px;border-radius:8px;box-sizing:border-box;min-height:58px"></textarea>'+
        '<div class="row" style="gap:8px;margin-top:6px;align-items:center"><button class="btn primary" onclick="replySupport(\''+m.id+'\')">Ответить</button>'+
        (m.status==='new'?'<button class="btn" onclick="resolveSupport(\''+m.id+'\')">Решено без ответа</button>':'')+
        '<span id="reps-'+m.id+'" style="font-size:13px"></span></div>'+
      '</div>';
    });
    el.innerHTML=h;
  };
  window.resolveSupport = async function(id){
    var j=await apiPost('/api/admin/support-resolve',{id:id});
    if(j.ok) openSupport(); else alert(j.error||'Ошибка');
  };
  window.replySupport = async function(id){
    var ta=document.getElementById('rep-'+id); var txt=(ta&&ta.value||'').trim();
    var st=document.getElementById('reps-'+id);
    if(!txt){ if(st){ st.textContent='Напишите ответ.'; st.style.color='#C0483C'; } return; }
    if(st){ st.textContent='Отправляем…'; st.style.color='#888'; }
    var j=await apiPost('/api/admin/support-reply',{id:id, text:txt});
    if(j.ok){ openSupport(); } else { if(st){ st.textContent=j.error||'Не удалось отправить.'; st.style.color='#C0483C'; } }
  };
  function fmt(d){ try{ var p=String(d).split('-'); return p[2]+'.'+p[1]; }catch(e){ return String(d); } }

  window.openCohort = async function(cohortId, title){
    CUR={ id:cohortId, title:title };
    only('list');
    var el=document.getElementById('list');
    var j=await apiGet('/api/admin/participants',{ cohort_id:cohortId });
    if(!j.ok){ el.innerHTML='<button class="back" onclick="loadCohortsList()">← ко всем потокам</button><div class="err">'+esc(j.error)+'</div>'; return; }
    document.getElementById('sub').textContent=(j.cohort&&j.cohort.title)||title||'';
    var s=j.summary;
    var h='<button class="back" onclick="loadCohortsList()">← ко всем потокам</button>'+
      '<div class="stat">'+
      tile(s.total,'участников')+tile(s.completed,'завершили')+tile(s.avgProgress+'%','сред. прогресс')+tile(s.tasksDone+'/'+s.tasksTotal,'задания')+
      '</div>'+
      '<div class="row" style="margin:0 0 10px;gap:8px;flex-wrap:wrap"><button class="btn" onclick="editDates()">✎ Даты и приём</button><button class="btn" onclick="editSchedule()">🗓 Расписание</button></div>'+
      '<div id="datesbox"></div>'+
      '<div id="schedbox"></div>'+
      '<h2>Участники</h2>';
    var studs=j.participants.filter(function(p){return p.role==='student';});
    if(studs.length===0) h+='<div class="muted">Пока никто не зашёл.</div>';
    studs.forEach(function(p){
      h+='<div class="row" onclick="openDetail(\''+p.enrollment_id+'\')">'+
        '<div class="ava">'+esc((p.name||'?').charAt(0))+'</div>'+
        '<div><div class="nm">'+esc(p.name)+'</div><div class="sub">был '+p.attended+'/'+p.dayCount+' · задания '+p.done+'/'+p.dayCount+
          (p.feedback?' · <span class="chip c-ok">отзыв</span>':'')+'</div></div>'+
        '<div class="pr"><b>'+p.progress+'%</b><div class="bar"><span style="width:'+p.progress+'%"></span></div></div>'+
      '</div>';
    });
    el.innerHTML=h;
  }
  function tile(n,l){ return '<div class="box"><div class="num">'+n+'</div><div class="lab">'+l+'</div></div>'; }

  window.backToList = function(){ if(CUR) openCohort(CUR.id, CUR.title); else loadCohortsList(); };
  window.openDetail = async function(id){
    only('detail');
    var el=document.getElementById('detail'); el.innerHTML='<div class="muted">Загрузка…</div>';
    var j=await apiGet('/api/admin/participant',{enrollment_id:id});
    if(!j.ok){ el.innerHTML='<button class="back" onclick="backToList()">← назад</button><div class="err">'+esc(j.error)+'</div>'; return; }
    var h='<button class="back" onclick="backToList()">← ко всем участникам</button>';
    h+='<div class="card"><h3>'+esc(j.participant.name)+'</h3>';
    if(j.feedback) h+='<div class="flags"><span class="chip c-ok">Отзыв: '+(j.feedback.kind==='video'?'видео':'текст')+'</span>'+(j.participant.bonus_course?' <span class="chip c-ok">🎁 мини-курс открыт</span>':'')+'</div>';
    h+='<div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">';
    if(j.feedback && j.feedback.kind==='video'){
      if(j.participant.bonus_course) h+='<button class="btn" onclick="grantCourse(\''+id+'\',true)">Закрыть мини-курс</button>';
      else h+='<button class="btn primary" onclick="grantCourse(\''+id+'\',false)">🎁 Открыть мини-курс</button>';
    }
    h+='<button class="btn" onclick="moveDialog(\''+id+'\')">↔ Перенести в поток</button>';
    h+='</div><div id="movebox"></div>';
    h+='</div>';
    j.days.forEach(function(d){
      h+='<div class="card"><h3>'+esc(d.title)+'</h3>'+
        '<div class="flags">'+(d.attended?'<span class="chip c-ok">был</span>':'<span class="chip">не отмечен</span>')+
        (d.done?'<span class="chip c-ok">задание сдано</span>':'<span class="chip">нет задания</span>')+
        (d.reviewed?'<span class="chip c-ok">✓ принято</span>':'')+'</div>';
      d.answers.forEach(function(qa){ h+='<div class="qa"><div class="q">'+esc(qa.q)+'</div><div class="a">'+(qa.a?esc(qa.a):'<span class="muted">— нет ответа</span>')+'</div></div>'; });
      if(d.done && !d.reviewed) h+='<div style="margin-top:10px"><button class="btn primary" onclick="review(\''+id+'\',\''+d.step_id+'\')">Отметить «Принято»</button></div>';
      if(d.review_comment) h+='<div class="muted" style="margin-top:6px">Комментарий: '+esc(d.review_comment)+'</div>';
      h+='</div>';
    });
    el.innerHTML=h;
  };

  window.review = async function(eid, sid){
    var j=await apiPost('/api/admin/review',{enrollment_id:eid, step_id:sid});
    if(j.ok) openDetail(eid); else alert(j.error||'Ошибка');
  };

  // Открыть/закрыть мини-курс
  window.grantCourse = async function(eid, revoke){
    var j=await apiPost('/api/admin/grant-course',{enrollment_id:eid, revoke:!!revoke});
    if(j.ok) openDetail(eid); else alert(j.error||'Ошибка');
  };
  // Перенос участника в другой поток
  window.moveDialog = async function(eid){
    var box=document.getElementById('movebox'); if(!box) return;
    box.innerHTML='<div class="muted" style="margin-top:8px">Загрузка потоков…</div>';
    var j=await apiGet('/api/admin/cohorts');
    if(!j.ok){ box.innerHTML='<div class="err">'+esc(j.error||'Ошибка')+'</div>'; return; }
    var opts=j.cohorts.map(function(c){return '<option value="'+c.id+'">'+esc(c.title)+'</option>';}).join('');
    box.innerHTML='<div class="row" style="margin-top:10px;gap:8px;align-items:center"><select id="movesel" style="flex:1;padding:8px;border-radius:8px">'+opts+'</select>'+
      '<button class="btn primary" onclick="doMove(\''+eid+'\')">Перенести</button></div>';
  };
  window.doMove = async function(eid){
    var sel=document.getElementById('movesel'); if(!sel) return;
    var j=await apiPost('/api/admin/move-participant',{enrollment_id:eid, cohort_id:sel.value});
    if(j.ok){ CUR=null; loadCohortsList(); } else alert(j.error||'Ошибка');
  };
  // Редактирование дат/приёма потока
  window.editDates = async function(){
    var box=document.getElementById('datesbox'); if(!box||!CUR) return;
    var j=await apiGet('/api/admin/cohorts');
    var c=((j.cohorts||[]).filter(function(x){return x.id===CUR.id;})[0])||{};
    box.innerHTML='<div class="card"><div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">'+
      '<label>Старт <input type="date" id="d-start" value="'+(c.starts_on||'')+'" style="padding:6px"></label>'+
      '<label>Конец <input type="date" id="d-end" value="'+(c.ends_on||'')+'" style="padding:6px"></label>'+
      '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="d-active" '+(c.is_active?'checked':'')+'> приём открыт</label>'+
      '<button class="btn primary" onclick="saveDates()">Сохранить</button>'+
      '<span id="dates-status" style="font-size:13px"></span></div></div>';
  };
  window.saveDates = async function(){
    setStatus('dates-status','wait','Сохраняем…');
    var b={cohort_id:CUR.id, starts_on:(document.getElementById('d-start').value||null), ends_on:(document.getElementById('d-end').value||null), is_active:document.getElementById('d-active').checked};
    var j=await apiPost('/api/admin/update-cohort',b);
    if(j.ok){ setStatus('dates-status','ok','✓ Сохранено'); } else { setStatus('dates-status','err',j.error||'Ошибка'); }
  };

  // Расписание потока (список для студентов)
  var SCHED=[];
  window.editSchedule = async function(){
    var box=document.getElementById('schedbox'); if(!box||!CUR) return;
    box.innerHTML='<div class="muted">Загрузка…</div>';
    var j=await apiGet('/api/admin/cohorts');
    var c=((j.cohorts||[]).filter(function(x){return x.id===CUR.id;})[0])||{};
    SCHED=Array.isArray(c.schedule)?c.schedule.slice():[];
    if(SCHED.length===0) SCHED=[{title:'',at:'',note:''}];
    renderSched();
  };
  window.renderSched = function(){
    var box=document.getElementById('schedbox'); if(!box) return;
    var h='<div class="card"><h3>Расписание потока</h3><div class="muted" style="margin-bottom:8px">Студенты увидят этот список на вкладке «Занятия».</div>';
    SCHED.forEach(function(s,i){
      h+='<div class="row" style="gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">'+
        '<input placeholder="Название (напр. День 1)" value="'+esc(s.title||'')+'" oninput="SCHED['+i+'].title=this.value" style="flex:1;min-width:130px;padding:6px;border-radius:8px">'+
        '<input type="datetime-local" value="'+esc(s.at||'')+'" oninput="SCHED['+i+'].at=this.value" style="padding:6px;border-radius:8px">'+
        '<input placeholder="заметка" value="'+esc(s.note||'')+'" oninput="SCHED['+i+'].note=this.value" style="flex:1;min-width:110px;padding:6px;border-radius:8px">'+
        '<button class="btn" onclick="SCHED.splice('+i+',1);renderSched()">✕</button>'+
      '</div>';
    });
    h+='<div class="row" style="gap:8px;margin-top:6px;align-items:center"><button class="btn" onclick="SCHED.push({title:\'\',at:\'\',note:\'\'});renderSched()">+ Добавить пункт</button>'+
       '<button class="btn primary" onclick="saveSchedule()">Сохранить расписание</button>'+
       '<span id="sched-status" style="font-size:13px"></span></div></div>';
    box.innerHTML=h;
  };
  function setStatus(id, kind, txt){ var el=document.getElementById(id); if(!el) return; el.textContent=txt; el.style.color = kind==='ok'?'#1E8A5A':(kind==='err'?'#C0483C':'var(--ink-faint,#888)'); }
  window.saveSchedule = async function(){
    setStatus('sched-status','wait','Сохраняем…');
    var clean=SCHED.filter(function(s){return (s.title&&s.title.trim())||(s.at&&s.at.trim());});
    var j=await apiPost('/api/admin/update-cohort',{cohort_id:CUR.id, schedule:clean});
    if(j.ok){ setStatus('sched-status','ok','✓ Сохранено'); } else { setStatus('sched-status','err',j.error||'Ошибка'); }
  };

  // ---- Конструктор интенсива: интенсивы → шаги → вопросы к заданиям ----
  var PG={course:null, steps:[]};
  var STEP_TYPE_NAMES={intro:'Старт', day:'Занятие', feedback:'Обратная связь', bonus:'Бонус'};
  function pgView(){ only('cohorts'); return document.getElementById('cohorts'); }
  function pgAuthFail(j){ if(j._status===401||j._status===403){ showLogin('Конструктор доступен куратору, вошедшему по логину и паролю.'); return true; } return false; }

  window.openProgram=async function(){
    var el=pgView(); document.getElementById('sub').textContent='программа';
    el.innerHTML='<div class="muted">Загрузка…</div>';
    var j=await apiGet('/api/admin/program-courses');
    if(!j.ok){ if(!pgAuthFail(j)) el.innerHTML='<div class="err">'+esc(j.error||'Ошибка')+'</div>'; return; }
    var h='<button class="back" onclick="loadHome()">← в кабинет</button><h2>Программа интенсивов</h2>'+
      '<div class="muted" style="margin:0 2px 10px">Выберите интенсив, чтобы редактировать его шаги и задания.</div>';
    j.courses.forEach(function(c){
      h+='<div class="row" onclick="openCourse(\''+esc(c.key)+'\')"><div><div class="nm">'+esc(c.title)+'</div>'+
        '<div class="sub">шагов: '+c.steps+' · потоков: '+c.cohorts+(c.active_cohorts?' (открыт приём: '+c.active_cohorts+')':'')+
        ' · '+(c.open_all?'всё открыто сразу':'по порядку')+'</div></div><div class="pr">›</div></div>';
    });
    h+='<div class="card"><h3>Новый интенсив</h3>'+
      '<input id="pg-new-title" class="lin" placeholder="Название, напр. «Спринт: продажи в Instagram»" maxlength="200">'+
      '<div style="margin-top:8px"><button class="btn primary" onclick="createCourse()">+ Создать интенсив</button> <span id="pg-new-st" class="muted"></span></div></div>';
    el.innerHTML=h;
  };

  window.createCourse=async function(){
    var t=(document.getElementById('pg-new-title').value||'').trim();
    if(!t){ setStatus('pg-new-st','err','Введите название'); return; }
    setStatus('pg-new-st','wait','Создаём…');
    var j=await apiPost('/api/admin/program-course-save',{title:t});
    if(!j.ok){ setStatus('pg-new-st','err',j.error||'Ошибка'); return; }
    openCourse(j.course.key);
  };

  window.openCourse=async function(key){
    var el=pgView(); el.innerHTML='<div class="muted">Загрузка…</div>';
    var cj=await apiGet('/api/admin/program-courses');
    var sj=await apiGet('/api/admin/program-steps',{course:key});
    if(!cj.ok||!sj.ok){ if(!pgAuthFail(cj.ok?sj:cj)) el.innerHTML='<div class="err">'+esc((cj.ok?sj:cj).error||'Ошибка')+'</div>'; return; }
    PG.course=cj.courses.filter(function(c){return c.key===key;})[0]; PG.steps=sj.steps;
    if(!PG.course){ el.innerHTML='<div class="err">Интенсив не найден</div>'; return; }
    document.getElementById('sub').textContent=PG.course.title;
    var c=PG.course;
    var h='<button class="back" onclick="openProgram()">← ко всем интенсивам</button><h2>'+esc(c.title)+'</h2>'+
      '<div class="card"><h3>Настройки интенсива</h3>'+
      '<input id="pg-title" class="lin" value="'+esc(c.title)+'" maxlength="200">'+
      '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input type="checkbox" id="pg-open" '+(c.open_all?'checked':'')+'> Открыть ученикам все шаги сразу</label>'+
      '<div class="muted" style="margin:4px 0 0 24px">Если выключено: занятия открываются по порядку (следующее — после задания предыдущего), обратная связь и бонус — после всех занятий.</div>'+
      '<div style="margin-top:10px"><button class="btn primary" onclick="saveCourse()">Сохранить настройки</button> <span id="pg-c-st" class="muted"></span></div></div>'+
      '<h2>Шаги программы</h2>';
    if(!PG.steps.length) h+='<div class="muted" style="margin:0 2px 10px">Шагов пока нет — добавьте первый.</div>';
    PG.steps.forEach(function(s,i){
      h+='<div class="row" style="cursor:default"><div style="display:flex;flex-direction:column;gap:2px">'+
        '<button class="btn" style="padding:2px 8px" '+(i===0?'disabled':'')+' onclick="moveStep('+i+',-1)">↑</button>'+
        '<button class="btn" style="padding:2px 8px" '+(i===PG.steps.length-1?'disabled':'')+' onclick="moveStep('+i+',1)">↓</button></div>'+
        '<div style="flex:1;cursor:pointer" onclick="editStep('+i+')"><div class="nm">'+esc(s.title)+'</div>'+
        '<div class="sub">'+esc(STEP_TYPE_NAMES[s.type]||s.type)+(s.has_tasks?' · задание':'')+(s.questions.length?' · вопросов: '+s.questions.length:'')+
        (s.code_word?' · кодовое слово':'')+(s.student_data?' · <span class="chip c-amber">есть данные учеников</span>':'')+'</div></div>'+
        '<div class="pr" style="cursor:pointer" onclick="editStep('+i+')">✎</div></div>';
    });
    h+='<div class="row" style="margin-top:4px"><button class="btn primary" style="width:100%" onclick="editStep(-1)">+ Добавить шаг</button></div>'+
      '<div id="pg-order-st" class="muted"></div>'+
      '<div class="card" style="margin-top:14px"><h3>Новый поток этого интенсива</h3>'+
      '<input id="pg-coh-title" class="lin" placeholder="Название потока, напр. «Поток 4»" maxlength="200">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><label>Старт <input type="date" id="pg-coh-s" style="padding:6px"></label><label>Конец <input type="date" id="pg-coh-e" style="padding:6px"></label></div>'+
      '<div style="margin-top:8px"><button class="btn" onclick="createCohort()">+ Создать поток</button> <span id="pg-coh-st" class="muted"></span></div>'+
      '<div class="muted" style="margin-top:6px">Расписание встреч, Zoom и приём потока настраиваются в «Потоках».</div></div>';
    el.innerHTML=h;
  };

  window.saveCourse=async function(){
    setStatus('pg-c-st','wait','Сохраняем…');
    var j=await apiPost('/api/admin/program-course-save',{key:PG.course.key, title:document.getElementById('pg-title').value, open_all:document.getElementById('pg-open').checked});
    if(!j.ok){ setStatus('pg-c-st','err',j.error||'Ошибка'); return; }
    PG.course.title=j.course.title; PG.course.open_all=j.course.open_all; setStatus('pg-c-st','ok','✓ Сохранено');
  };

  window.moveStep=async function(i,d){
    var j=i+d; if(j<0||j>=PG.steps.length) return;
    var t=PG.steps[i]; PG.steps[i]=PG.steps[j]; PG.steps[j]=t;
    var r=await apiPost('/api/admin/program-steps-order',{course_key:PG.course.key, ids:PG.steps.map(function(s){return s.id;})});
    if(!r.ok){ alert(r.error||'Не удалось сохранить порядок'); }
    openCourse(PG.course.key);
  };

  window.createCohort=async function(){
    var t=(document.getElementById('pg-coh-title').value||'').trim();
    if(!t){ setStatus('pg-coh-st','err','Введите название потока'); return; }
    setStatus('pg-coh-st','wait','Создаём…');
    var j=await apiPost('/api/admin/program-cohort-create',{course_key:PG.course.key, title:t, starts_on:document.getElementById('pg-coh-s').value, ends_on:document.getElementById('pg-coh-e').value});
    if(!j.ok){ setStatus('pg-coh-st','err',j.error||'Ошибка'); return; }
    setStatus('pg-coh-st','ok','✓ Поток «'+j.cohort.title+'» создан — он есть в «Потоках»');
  };

  var PQ=[]; // вопросы редактируемого шага
  window.editStep=function(i){
    var s=i>=0?PG.steps[i]:{type:'day', title:'', description:'', code_word:'', tetrad_url:'', video_url:'', quiz_url:'', has_tasks:true, questions:[], student_data:0};
    PQ=(s.questions||[]).map(function(q){return {id:q.id, text:q.text, has_answers:q.has_answers};});
    var el=pgView();
    var opt=function(v){ return '<option value="'+v+'" '+(s.type===v?'selected':'')+'>'+STEP_TYPE_NAMES[v]+'</option>'; };
    var fld=function(id,label,val,ph){ return '<div style="margin-top:10px"><div class="muted">'+label+'</div><input id="'+id+'" class="lin" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"></div>'; };
    el.innerHTML='<button class="back" onclick="openCourse(\''+esc(PG.course.key)+'\')">← к шагам</button><h2>'+(i>=0?'Шаг':'Новый шаг')+'</h2>'+
      '<div class="card">'+
      '<div class="muted">Тип шага</div><select id="ps-type" class="lin">'+opt('intro')+opt('day')+opt('feedback')+opt('bonus')+'</select>'+
      fld('ps-title','Название','' + (s.title||''),'напр. «День 1. Клиентский сценарий»')+
      '<div style="margin-top:10px"><div class="muted">Описание для ученика</div><textarea id="ps-desc" class="lin" style="min-height:120px">'+esc(s.description||'')+'</textarea></div>'+
      fld('ps-video','Ссылка на видео',s.video_url,'https://…')+
      fld('ps-tetrad','Ссылка на рабочую тетрадь / презентацию',s.tetrad_url,'https://…')+
      fld('ps-quiz','Ссылка на тест',s.quiz_url,'https://…')+
      fld('ps-code','Кодовое слово для отметки посещения (пусто — без отметки)',s.code_word,'напр. «старт»')+
      '<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="ps-tasks" '+(s.has_tasks?'checked':'')+'> В шаге есть задание (ученик отвечает на вопросы ниже)</label>'+
      '</div><h2>Вопросы задания</h2><div id="pq-list"></div>'+
      '<div class="row"><button class="btn" style="width:100%" onclick="addQ()">+ Добавить вопрос</button></div>'+
      '<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn primary" onclick="saveStep(\''+(s.id||'')+'\')">💾 Сохранить шаг</button>'+
      (i>=0?'<button class="btn" onclick="deleteStep(\''+s.id+'\','+(s.student_data||0)+')">Удалить шаг</button>':'')+
      ' <span id="ps-st" class="muted"></span></div>'+
      (s.student_data?'<div class="muted">По этому шагу уже есть данные учеников ('+s.student_data+') — его можно менять, но не удалить.</div>':'');
    renderQ();
  };

  function renderQ(){
    var box=document.getElementById('pq-list'); if(!box) return;
    if(!PQ.length){ box.innerHTML='<div class="muted" style="margin:0 2px 8px">Вопросов нет.</div>'; return; }
    box.innerHTML=PQ.map(function(q,i){
      return '<div class="card" style="padding:10px"><div style="display:flex;gap:6px;align-items:flex-start">'+
        '<div style="display:flex;flex-direction:column;gap:2px"><button class="btn" style="padding:2px 8px" '+(i===0?'disabled':'')+' onclick="moveQ('+i+',-1)">↑</button><button class="btn" style="padding:2px 8px" '+(i===PQ.length-1?'disabled':'')+' onclick="moveQ('+i+',1)">↓</button></div>'+
        '<textarea class="lin" style="min-height:56px;flex:1" oninput="PQ['+i+'].text=this.value" placeholder="Текст вопроса">'+esc(q.text)+'</textarea>'+
        (q.has_answers?'<span class="chip c-amber" title="На вопрос уже отвечали — удалить нельзя">ответы</span>':'<button class="btn" onclick="delQ('+i+')">✕</button>')+
        '</div></div>';
    }).join('');
  }
  window.addQ=function(){ PQ.push({text:''}); renderQ(); };
  window.delQ=function(i){ PQ.splice(i,1); renderQ(); };
  window.moveQ=function(i,d){ var j=i+d; if(j<0||j>=PQ.length) return; var t=PQ[i]; PQ[i]=PQ[j]; PQ[j]=t; renderQ(); };

  window.saveStep=async function(id){
    var v=function(x){ return (document.getElementById(x).value||'').trim(); };
    var body={id:id||undefined, course_key:PG.course.key, type:v('ps-type'), title:v('ps-title'), description:document.getElementById('ps-desc').value,
      video_url:v('ps-video'), tetrad_url:v('ps-tetrad'), quiz_url:v('ps-quiz'), code_word:v('ps-code'),
      has_tasks:document.getElementById('ps-tasks').checked,
      questions:PQ.filter(function(q){return (q.text||'').trim();}).map(function(q){return {id:q.id, text:q.text};})};
    setStatus('ps-st','wait','Сохраняем…');
    var j=await apiPost('/api/admin/program-step-save',body);
    if(!j.ok){ setStatus('ps-st','err',j.error||'Ошибка'); return; }
    setStatus('ps-st','ok','✓ Сохранено');
    setTimeout(function(){ openCourse(PG.course.key); }, 500);
  };

  window.deleteStep=async function(id,data){
    if(data){ alert('По этому шагу уже есть данные учеников — удалить нельзя.'); return; }
    if(!confirm('Удалить шаг вместе с его вопросами? Это нельзя отменить.')) return;
    var j=await apiPost('/api/admin/program-step-delete',{id:id});
    if(!j.ok){ setStatus('ps-st','err',j.error||'Ошибка'); return; }
    openCourse(PG.course.key);
  };

  // Точка входа: есть токен/dev/Telegram → в кабинет; иначе — форма логина.
  if (TOKEN || DEV || initData) { loadHome(); } else { showLogin(); }
</script>
</body>
</html>
