<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полезные материалы</title>
<style>
  :root{--bg:#0F172A;--topbar:#1E3A5F;--accent:#C9A96E;--card:#18263E;--ink:#EAF0F8;--muted:#9FB2CC;--line:#2B3E5C;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:0 14px calc(86px + env(safe-area-inset-bottom));overflow-x:hidden;}
  html,body{overscroll-behavior:none;}
  header{display:flex;align-items:center;gap:10px;padding:16px 2px 12px;background:var(--bg)}
  header .dot{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--accent)}
  header .dot img{width:100%;height:100%;object-fit:cover;display:block}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
  .card h3{font-size:15.5px;margin:0 0 8px;font-weight:600}
  .video{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tapcover{position:absolute;inset:0;z-index:2;background:transparent;border:none;padding:0;cursor:pointer}
  /* Запущенное видео: поворот телефона в альбомную → на весь экран (как на YouTube) */
  @media (orientation:landscape){
    .video.active{position:fixed;inset:0;margin:0;width:100vw;height:100vh;padding-top:0;border-radius:0;z-index:9999;background:#000}
    .video.active iframe{position:absolute;inset:0;width:100%;height:100%}
  }
  /* Плитки списка эфиров */
  .vtile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;cursor:pointer}
  .vtile .thumb{position:relative;padding-top:56.25%;background:#0b0b0b}
  .vtile .thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vtile .tapcover{position:absolute;inset:0;z-index:2;background:transparent;border:none;padding:0;cursor:pointer}
  .vtile .playic{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .vtile .playic span{width:54px;height:54px;border-radius:50%;background:rgba(201,169,110,.92);color:#12233c;display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:3px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .vtile .vtitle{padding:11px 14px;font-size:15.5px;font-weight:600}
  .back{background:none;border:none;color:var(--accent);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;padding:6px 2px;margin-bottom:8px}
  /* Плитки разделов */
  .sectile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;color:var(--ink);font:inherit}
  .sectile .semoji{font-size:24px;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;background:#22344F;border-radius:12px}
  .sectile .sinfo{flex:1;display:flex;flex-direction:column;gap:2px}
  .sectile .sname{font-size:16px;font-weight:600}
  .sectile .scount{font-size:12.5px;color:var(--muted)}
  .sectile .sarr{font-size:22px;color:var(--muted);flex:none}
  .pl-title{font-size:17px;font-weight:600;margin:12px 2px 0}
  .hint{color:var(--muted);font-size:13px;line-height:1.5}
  .btn{display:block;width:100%;text-align:center;border:none;border-radius:10px;padding:12px;font-size:14.5px;font-weight:600;
    cursor:pointer;font-family:inherit;background:var(--accent);color:#1E3A5F;text-decoration:none}
  .att{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .att a{flex:1;min-width:130px;text-align:center;padding:10px;border-radius:10px;font-size:13.5px;font-weight:600;
    text-decoration:none;background:#22344F;color:#EAF0F8;border:1px solid var(--line)}
  .gate{margin-top:18px}
  .gate .lock{font-size:34px;text-align:center;margin:6px 0}
  .center{text-align:center}
  .load{color:var(--muted);text-align:center;padding:40px 0}
  /* Нижнее меню вкладок */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--topbar);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;min-width:0;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px}
  .tabbar button .ti{font-size:20px;line-height:1}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .ev{display:flex;gap:12px;align-items:flex-start}
  .ev .when{flex:none;width:58px;text-align:center;background:#22344F;border-radius:10px;padding:8px 4px}
  .ev .when b{display:block;font-size:18px}
  .ev .when span{font-size:11.5px;color:var(--muted)}
  .ev .info{flex:1;min-width:0}
  .ev .info .t{font-size:15.5px;font-weight:600}
  .ev .info .x{font-size:13px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
  <header>
    <span class="dot"><img src="files/prorost-logo.jpg" alt=""></span>
    <div><h1>Полезные материалы</h1><div class="sub">Клуб «Про Рост Онлайн»</div></div>
  </header>
  <div id="app"><div class="load">Загрузка…</div></div>
  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="materials" class="on"><span class="ti">📚</span>Материалы</button>
    <button type="button" data-tab="events"><span class="ti">📅</span>Эфиры</button>
    <button type="button" data-tab="shop"><span class="ti">🛍</span>Магазин</button>
    <button type="button" data-tab="chat"><span class="ti">👥</span>Чат</button>
    <button type="button" data-tab="support"><span class="ti">💬</span>Связь</button>
  </nav>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  var tgw = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var _qs = new URLSearchParams(location.search);
  if(tgw){
    var isMobile = (tgw.platform==='android' || tgw.platform==='ios');
    try{ tgw.ready(); tgw.expand(); }catch(e){}
    try{ if(isMobile && tgw.disableVerticalSwipes) tgw.disableVerticalSwipes(); }catch(e){}
    try{ if(tgw.setHeaderColor) tgw.setHeaderColor('#0F172A'); if(tgw.setBackgroundColor) tgw.setBackgroundColor('#0F172A'); }catch(e){}
  }

  function authHeaders(){ var h={'content-type':'application/json'}; if(tgw && tgw.initData){ h['x-init-data']=tgw.initData; } return h; }
  function authPath(p){ if(!(tgw && tgw.initData)){ p += (p.indexOf('?')>=0?'&':'?')+'tg='+encodeURIComponent(_qs.get('tg')||'100000001'); } return p; }
  function api(p,opts){ opts=opts||{}; return fetch(authPath(p),{method:opts.method||'GET',headers:authHeaders(),body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){return r.json();}); }
  function esc(x){ return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function embedSrc(u,autoplay){ u=String(u||''); return u + (u.indexOf('?')>=0?'&':'?') + 'showTitle=true&showControls=true&muted=false&autoplay=' + (autoplay?'true':'false'); }

  function renderGate(){
    var app=document.getElementById('app');
    app.innerHTML='<div class="card gate"><div class="lock">🔒</div>'+
      '<h3 class="center">Только для участников клуба</h3>'+
      '<p class="hint center">Материалы и эфиры доступны участникам клуба «Про Рост Онлайн». Если вы уже оплатили — войдите в канал клуба по кнопке из бота.</p>'+
      '<div style="margin-top:12px"><button class="btn" id="join">Вступить в клуб</button></div></div>';
    var b=document.getElementById('join');
    b.addEventListener('click',function(){ openUrl(LINKS.pay); });
  }

  var ALL=[], SECTIONS=[], CURRENT=[], GS=[], SCHED=[], MEMBER=false, LOADED=false;
  var LINKS={ shop:'https://prorostonline.com/shop', chat:'https://t.me/+Ev7OzmOXRAhiNGJi', support:'https://t.me/bahitadminbot?start=support', pay:'https://nvl.neurovialabs.kz/light' };

  // t.me — внутри Telegram, остальное — во внешнем браузере.
  function openUrl(u){
    if(!u) return;
    var isTg=/^https:\/\/t\.me\//.test(u);
    if(tgw && isTg && tgw.openTelegramLink){ tgw.openTelegramLink(u); }
    else if(tgw && tgw.openLink){ tgw.openLink(u); }
    else { window.open(u,'_blank','noopener'); }
  }

  var WD=['вс','пн','вт','ср','чт','пт','сб'], MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  function renderEvents(){
    var app=document.getElementById('app');
    if(!MEMBER){ renderGate(); return; }
    var today=new Date(); today.setHours(0,0,0,0);
    var list=SCHED.filter(function(s){ return s && s.date && new Date(s.date+'T00:00:00')>=today; })
      .sort(function(a,b){ return (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')); });
    var h='<div class="pl-title" style="margin:2px 2px 10px">Ближайшие эфиры</div>';
    if(!list.length){ app.innerHTML=h+'<div class="card"><p class="hint">Новых эфиров пока нет — анонсы появятся здесь и в канале.</p></div>'; return; }
    list.forEach(function(s,i){
      var d=new Date(s.date+'T00:00:00');
      h+='<div class="card"><div class="ev">'+
        '<div class="when"><b>'+d.getDate()+'</b><span>'+MON[d.getMonth()]+', '+WD[d.getDay()]+'</span></div>'+
        '<div class="info"><div class="t">'+esc(s.title||'Эфир')+'</div>'+
        '<div class="x">'+(s.time?('🕖 '+esc(s.time)):'')+(s.expert?(' · '+esc(s.expert)):'')+'</div>'+
        (s.zoom?('<div style="margin-top:10px"><button class="btn" type="button" data-zoom="'+i+'">Подключиться</button></div>'):'')+
        '</div></div></div>';
    });
    app.innerHTML=h;
    app.querySelectorAll('[data-zoom]').forEach(function(btn){
      btn.addEventListener('click',function(){ openUrl(list[+btn.getAttribute('data-zoom')].zoom); });
    });
  }

  function setTab(t){
    if(t==='shop'){ openUrl(LINKS.shop); return; }
    if(t==='chat'){ openUrl(LINKS.chat); return; }
    if(t==='support'){ openUrl(LINKS.support); return; }
    document.querySelectorAll('#tabbar button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab')===t); });
    window.scrollTo(0,0);
    if(!LOADED){ return; }
    if(t==='events'){ renderEvents(); return; }
    if(!MEMBER){ renderGate(); return; }
    renderHome();
  }
  document.getElementById('tabbar').addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]'); if(b) setTab(b.getAttribute('data-tab'));
  });
  function knownSec(id){ return SECTIONS.some(function(s){return s.id===id;}); }
  // Раздел видео: свой, если существует; иначе — первый (туда падают старые видео без раздела).
  function effSec(v){ return (v.section && knownSec(v.section)) ? v.section : (SECTIONS[0] && SECTIONS[0].id || ''); }
  function groups(){
    return SECTIONS.map(function(s){
      return { sec:s, vids: ALL.filter(function(v){ return effSec(v)===s.id; }) };
    }).filter(function(g){ return g.vids.length>0; });
  }
  function videoCard(v,i){
    var att='';
    if(v.presentation) att+='<a href="'+esc(v.presentation)+'" target="_blank" rel="noopener">📊 Презентация</a>';
    if(v.workbook) att+='<a href="'+esc(v.workbook)+'" target="_blank" rel="noopener">📓 Рабочая тетрадь</a>';
    return '<div class="card">'+
      '<h3>'+esc(v.title||'Эфир')+'</h3>'+
      '<div class="video" data-i="'+i+'"><iframe src="'+esc(embedSrc(v.embed))+'" allow="accelerometer; autoplay; fullscreen; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe><button class="tapcover" type="button"></button></div>'+
      (att?('<div class="att">'+att+'</div>'):'')+
      '</div>';
  }
  // Главный экран: если разделов с видео больше одного — плитки разделов; иначе сразу список.
  function renderHome(){
    GS=groups();
    if(GS.length<=1){ var g=GS[0]; renderList(g?g.vids:[], g?g.sec.title:'', false); return; }
    var app=document.getElementById('app');
    var h='<div class="pl-title" style="margin:2px 2px 10px">Разделы</div>';
    GS.forEach(function(g,i){
      h+='<button class="sectile" data-si="'+i+'" type="button">'+
           '<span class="semoji">'+esc(g.sec.emoji||'📺')+'</span>'+
           '<span class="sinfo"><span class="sname">'+esc(g.sec.title)+'</span>'+
           '<span class="scount">'+g.vids.length+' видео</span></span>'+
           '<span class="sarr">›</span>'+
         '</button>';
    });
    app.innerHTML=h;
  }
  function renderList(vids,title,withBack){
    CURRENT=vids||[];
    var app=document.getElementById('app');
    var h='';
    if(withBack) h+='<button class="back" id="back-sec">← Разделы</button>';
    if(title) h+='<div class="pl-title" style="margin-bottom:10px">'+esc(title)+'</div>';
    if(!CURRENT.length){ h+='<div class="card"><p class="hint">Здесь пока нет видео.</p></div>'; app.innerHTML=h; }
    else { CURRENT.forEach(function(v,i){ h+=videoCard(v,i); }); app.innerHTML=h; }
    var bk=document.getElementById('back-sec'); if(bk) bk.addEventListener('click',function(){ renderHome(); });
  }

  function boot(){
    api('/api/tg?action=clubcheck').then(function(j){
      if(!j || !j.ok){ document.getElementById('app').innerHTML='<div class="card"><p class="hint">Не удалось загрузить. Откройте из бота ещё раз.</p></div>'; return; }
      LOADED=true; MEMBER=!!j.member;
      if(j.links){ for(var k in j.links){ if(j.links[k]) LINKS[k]=j.links[k]; } }
      SCHED=Array.isArray(j.schedule)?j.schedule:[];
      if(!j.member){ renderGate(); return; }
      ALL=Array.isArray(j.videos)?j.videos:[];
      SECTIONS=(Array.isArray(j.sections)&&j.sections.length)?j.sections:[{id:'tochka-rosta',title:'Точка Роста',emoji:'🚀'}];
      // Вкладка из ссылки: t.me/bahitadminbot?startapp=events или video.html?tab=events
      var sp=(tgw && tgw.initDataUnsafe && tgw.initDataUnsafe.start_param) || _qs.get('tab') || '';
      if(sp==='events'){ setTab('events'); return; }
      renderHome();
    }).catch(function(){ document.getElementById('app').innerHTML='<div class="card"><p class="hint">Ошибка загрузки.</p></div>'; });
  }
  document.addEventListener('click',function(e){
    // Тап по разделу → его видео
    var st=e.target.closest('.sectile');
    if(st){ var g=GS[+st.getAttribute('data-si')]; if(g) renderList(g.vids, g.sec.title, true); return; }
    // Тап по видео → запускаем прямо здесь (без отдельной вкладки) и делаем активным
    var cover=e.target.closest('.tapcover'); if(!cover) return;
    var vd=cover.closest('.video'); if(!vd) return;
    var v=CURRENT[+vd.getAttribute('data-i')];
    document.querySelectorAll('.video.active').forEach(function(x){ x.classList.remove('active'); });
    vd.classList.add('active');
    var ifr=vd.querySelector('iframe'); if(ifr && v){ ifr.src=embedSrc(v.embed,true); }
    cover.remove();
  });
  setTimeout(boot,0);
</script>
</body>
</html>
